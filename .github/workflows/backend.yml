name: Backend foundation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: editingtab_core_test
          POSTGRES_USER: editingtab_test
          POSTGRES_PASSWORD: ci-only-disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U editingtab_test -d editingtab_core_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CORE_TEST_DB_HOST: 127.0.0.1
      CORE_TEST_DB_PORT: "5432"
      CORE_TEST_DB_NAME: editingtab_core_test
      CORE_TEST_DB_USERNAME: editingtab_test
      CORE_TEST_DB_PASSWORD: ci-only-disposable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Unit tests (no development credentials)
        run: uv run --locked pytest -m "not integration"
      - name: Real PostgreSQL and migration verification
        run: uv run --locked pytest --integration tests/integration