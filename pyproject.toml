[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "editingtab-core"
version = "0.1.0"
description = "The Editing Tab backend foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "The Editing Tab", email = "the.editing.tab@gmail.com" }]
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["httpx2==2.13.0", "pytest==9.1.1", "ruff==0.16.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/editingtab_core"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires explicit isolated PostgreSQL test configuration"]
filterwarnings = ["error"]
[tool.uv]
# Starlette 1.6.0 still uses an alias deprecated in AnyIO 4.15.
# Keep warnings as errors; revisit this constraint with a Starlette update.
constraint-dependencies = ["anyio==4.14.2"]